name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.1.0"
          pattern: |
            cfta/**/*.hs
            cfta-generator/**/*.hs
            cfta-ghc/**/*.hs
            cfta-lean/**/*.hs

      - name: Set up hlint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"

      - name: Run hlint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["cfta", "cfta-generator", "cfta-ghc", "cfta-lean"]'
          fail-on: warning

  build-test-bench:
    name: GHC 9.14.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"
          cabal-update: true

      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3

      - name: Configure build plan
        run: cabal v2-build all --dry-run --enable-tests --enable-benchmarks

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        id: deps-cache
        env:
          key: cabal-store-microecta-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: cabal v2-build all --only-dependencies --enable-tests --enable-benchmarks

      - name: Save cached dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Check package metadata
        run: |
          (cd cfta && cabal check)
          (cd cfta-generator && cabal check)
          (cd cfta-ghc && cabal check)
          (cd cfta-lean && cabal check)

      - name: Build with strict warnings
        run: cabal v2-build all --enable-tests --enable-benchmarks --ghc-options=-Werror

      # The dense PathTrie representation used to make an -O2 build of the core
      # exhaust small development machines. This is the regression guard for
      # that: it fails here rather than in a downstream build, which is why the
      # cap is not baked into the library's ghc-options.
      - name: Guard compile-time memory of the optimized core
        run: |
          cabal v2-build lib:cfta \
            --enable-optimization=2 \
            --ghc-options='-Werror +RTS -K512M -M512M -RTS'

      - name: Test
        run: cabal v2-test all --enable-optimization=2 --ghc-options=-Werror --test-show-details=direct

      # Run the library examples with the supported compiler.
      - name: Doctest
        run: |
          cabal install doctest --ignore-project --overwrite-policy=always \
            --install-method=copy --installdir="$HOME/.local/bin"
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:cfta
          cabal repl --with-repl="$HOME/.local/bin/doctest" lib:cfta-generator

      - name: Test the generator examples
        run: |
          cabal v2-run cfta-pairs
          cabal v2-run cfta-liquid-pairs
          cabal v2-run cfta-finite-languages
          cabal v2-run cfta-draw-typed-expressions
          cabal v2-run cfta-safe-division
          cabal v2-run cfta-bounded-reads
          cabal v2-run cfta-red-black-trees
          cabal v2-run cfta-sorted-lists
          cabal v2-run cfta-typed-values
          cabal v2-run cfta-automaton-interop

      # The release check builds every dependency again, with documentation,
      # and takes about 30 minutes. It runs only on pull requests into main.
      - name: Validate release artifacts
        if: github.base_ref == 'main'
        run: |
          scripts/release.sh cfta --check-only
          scripts/release.sh cfta-generator --check-only

      - name: Benchmark
        run: cabal v2-bench all --enable-optimization=2

  # cfta-lean's tests and benchmark above run without Lean, and skip what needs
  # the oracle. This job builds the oracle with the toolchain of
  # cfta-lean/oracle/lean-toolchain and runs those parts. It is optional: no
  # job waits for it, and its failure does not fail the run.
  lean-oracle:
    name: Lean oracle (optional)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.16.1.0"
          cabal-update: true

      # The tactic's tests give mode (a) a budget of 2 s, which an
      # unoptimized hectare-propose does not meet.
      - name: Configure build plan
        run: cabal v2-build cfta-lean --dry-run --enable-tests --enable-benchmarks --enable-optimization=2

      - name: Restore cached dependencies
        uses: actions/cache/restore@v5
        env:
          key: cabal-store-microecta-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
          restore-keys: ${{ env.key }}-

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the oracle
        working-directory: cfta-lean/oracle
        run: lake build

      - name: Build cfta-lean
        run: cabal v2-build cfta-lean --enable-tests --enable-benchmarks --enable-optimization=2

      - name: Test against the oracle
        run: cabal v2-test cfta-lean --enable-optimization=2 --test-show-details=direct

      - name: Test the hectare? tactic
        working-directory: cfta-lean/oracle
        run: |
          HECTARE_PROPOSER="$(cd ../.. && cabal list-bin --enable-optimization=2 cfta-lean:exe:hectare-propose)" \
            lake env lean OracleTest/Tactic.lean

      - name: Benchmark mode (a) and mode (b)
        run: |
          cabal v2-bench hectare-lean --enable-optimization=2 --benchmark-options='core 30 firstOr countElem mapFunctor'
          HECTARE_LEAN_MODES=states cabal v2-bench hectare-lean --enable-optimization=2 \
            --benchmark-options='core 30 firstOr countElem mapFunctor'
